# Input and output directories (relative paths use this TOML file's directory)
[paths]
input_dir = "D:/Projects/MAGMA/raw_data"  # Directory containing the supplied MAGMA .dat recordings.
output_dir = "../outputs/preproc_data"  # Local preprocessing results; ignored by Git and excluded from PyCharm indexing.

# Recording selection and console output
[run]
verbosity = 1  # 0 = silent, 1 = high-level progress (default), 2 = detailed recording/QC summary.
subjects = [1]  # Subject IDs to process.
measurements = [1]  # Measurement IDs; every subject is paired with every measurement.
exclude_recordings = []  # Skip [subject, measurement] pairs, e.g. [[3, 1], [5, 2]].

# Supplied recording format and filename resolution
[input]
dat_file = ""  # Optional explicit .dat path; empty uses filename patterns; requires one subject/measurement pair.
fs_hz = 200.0  # Native sampling frequency in Hz.
channels = ["ECG1", "ECG2", "SpO2", "Resp-Lungs", "Blood Pressure", "Resp-Diaphragm"]  # Exact ASCII column order; no guessing or transposing.
filename_pattern = "ECG1_ECG2_SpO2_RespL_BP_RespD_fs200_Sub{subject}_Pom{measurement}_DeTr_Norm.dat"  # Primary filename with subject/measurement placeholders.
alternate_filename_pattern = "ECG1_ECG2_SpO2_RespL_BP_RespD_fs200_Sub{subject}_Pom{measurement}_DeTr_Norm_Glue.dat"  # Fallback filename when the primary is absent; empty disables it.

# Initial manual technical quality control
[qc]
channels = ["Resp-Lungs", "Resp-Diaphragm", "SpO2"]  # Channels displayed and assessed in manual QC, in this order; other native channels remain stored.
open_gui = true  # Open QC when no accepted review exists; false creates no manual review evidence.
review_again = false  # Reopen accepted QC explicitly and bypass the preprocessing cache when open_gui is true.
window_length = 600.0  # Initial visible window length, expressed in window_unit.
window_unit = "seconds"  # seconds | samples; 600 samples at 200 Hz is 3 seconds.
display_mode = "corrected_view"  # corrected_view | shared_scale | independent_scale; original modes show source orientation.
artifact_scope = "both_belts"  # both_belts | selected_channel; the latter marks only the dragged subplot's channel.
reviewer = "NO"  # Reviewer identifier; may also be entered in the GUI.
initial_rating = "unassessed"  # Initial channel quality; must stay unassessed until an explicit manual rating.
max_plot_points = 5000  # Maximum points drawn per channel; annotation indexing always uses native samples.

# Automatically reuse the latest compatible accepted QC from run folders (including recoverable pending runs); legacy qc/ is still read.
# Leave this table empty for automatic discovery; add paths only to override individual recordings.
[qc.annotation_files]
# Sub1_M1 = "../outputs/preproc_data/Sub1_M1/run0/qc.json"  # Optional accepted QC or summary.json override; path relative to this TOML.

# Preprocessed signal: automatic correction, accepted polarity, optional detrending and filtering
[preprocessing]
reuse_preproc = true  # Reuse the latest completed compatible run; false always saves a new run.
enabled = true  # Enable configured belt conditioning independently of review status; QC still controls analysis validity.
channels = ["Resp-Lungs", "Resp-Diaphragm"]  # Belts selected for detrending/filtering/smoothing; SpO2 is only artifact-corrected; ECG/BP are pass-through TODOs.
check_relative_belt_polarity = false  # Optional MATLAB-style relative assessment before QC; never flips either belt automatically.

# Smoothed signal: the single source for all future respiratory analyses
[preprocessing.smoothing]
method = "moving_mean"  # none | moving_mean | savitzky_golay; applied once here; all respiratory analyses use this saved waveform.
window_sec = 0.25  # Moving-mean window in seconds on the processed grid; MATLAB rounding gives 50 samples at 200 Hz, with shrinking endpoints.
sg_window = 51.0  # Savitzky-Golay window in sg_window_unit; must resolve to an odd number of samples.
sg_window_unit = "samples"  # samples | seconds; 0.255 seconds at 200 Hz gives 51 samples.
polyorder = 3  # Savitzky-Golay polynomial degree; must be nonnegative and smaller than its window in samples.

# Optional slow-drift detrending
[preprocessing.detrend]
method = "none"  # none | moving_detrend; filtering is configured separately; none avoids repeating external DeTr_Norm preprocessing.
window_sec = 60.0  # Moving-detrend window in seconds (MATLAB default); effective odd sample length is recorded.

# Optional native-grid Butterworth filtering (SciPy SOS; fourth order per pass)
[preprocessing.filtering.highpass]
enabled = false  # Apply one zero-phase high-pass before resampling; disabled for historical compatibility.
cutoff_hz = 0.01  # High-pass cutoff in Hz, below native Nyquist.
edge_pad_sec = 100.0  # Even reflection duration, capped at half the finite waveform; QC flags do not split filtering; matches preprocess_data.m.

[preprocessing.filtering.lowpass]
enabled = false  # Apply one zero-phase low-pass before resampling; SpO2 and ECG/BP are excluded.
cutoff_hz = 20.0  # Low-pass cutoff in Hz, below native Nyquist; independent of the resampling anti-alias FIR.
edge_pad_sec = 1.0  # Even reflection duration; the padded signal also receives a 12-sample odd filtfilt extension.

# Optional primary processed grid, after detrending/filtering and before one smoothing pass
[preprocessing.resampling]
resample_freq = 0.0  # Primary processed frequency in Hz for all six channels; 0 keeps native 200 Hz; original always stays native.
filter_half_width = 10  # FIR half-length multiplier of max(up, down); 10 matches SciPy's standard design.
kaiser_beta = 5.0  # Kaiser window parameter for the anti-alias FIR; SciPy's default is 5.0.

# Technical artifact handling
[preprocessing.artifacts]
automatic_detection = true  # Detect/correct obvious belt and SpO2 glitches before manual QC; automatic candidates are advisory.
belt_max_interpolation_sec = 0.25  # Maximum reconstructed belt interval in seconds; longer candidates remain unchanged.
spo2_units = "percent"  # Explicit input-unit declaration: percent | unknown; percentage-range checks must also pass before correction.
spo2_change_threshold_pp = 8.0  # Minimum abrupt SpO2 change in percentage points within approximately 0.15 seconds.
spo2_return_tolerance_pp = 2.0  # Maximum difference from the pre-artifact SpO2 level, in percentage points.
spo2_max_interpolation_sec = 30.0  # Maximum complete interpolated SpO2 interval in seconds, including edge padding.

# Versioned output files and inspection preview
[output]
schema_version = "dbat_preprocessing_v4"  # One final root preproc_signal dataset; readers also accept earlier schemas.
overwrite = false  # Existing outputs are preserved through immutable versioned runs; must remain false.
filename = "{recording_id}_preprocessing.h5"  # HDF5 filename; recording_id expands to SubN_MN.
save_preview = true  # Save a final preproc_signal inspection PNG for each recording.
preview_start_sec = 0.0  # Inspection preview start time in seconds from the recording's native zero origin.
preview_duration_sec = 60.0  # Inspection preview duration in seconds.
