[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "dbat"
version = "0.1.0"
description = "DBAT — Dysfunctional Breathing Analysis Tool: native IO and manual QC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "h5py>=3.11,<4",
]

[tool.setuptools]
packages = ["dbat", "dbat.io", "dbat.preprocessing"]
package-dir = { dbat = "src" }
